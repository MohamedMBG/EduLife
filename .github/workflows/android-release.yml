name: Android Release Build

on:
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Create mock google-services.json
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "1234567890", "project_id": "dummy-project" },
            "client": [ {
              "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef", "android_client_info": { "package_name": "com.baghdad.edulife" } },
              "api_key": [ { "current_key": "dummy_api_key" } ]
            } ],
            "configuration_version": "1"
          }
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: EduLife-release-apk
          path: app/build/outputs/apk/release/*.apk
