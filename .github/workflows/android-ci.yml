name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-quality-gate:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Create mock google-services.json
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "1234567890", "project_id": "dummy-project" },
            "client": [ {
              "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef", "android_client_info": { "package_name": "com.baghdad.edulife" } },
              "api_key": [ { "current_key": "dummy_api_key" } ]
            } ],
            "configuration_version": "1"
          }
          EOF

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduLife-debug-apk
          path: app/build/outputs/apk/debug/*.apk
