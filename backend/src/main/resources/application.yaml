server:
  # Tomcat advertises its identity in the Server header by default; clear it so the server stack
  # is not broadcast in every response.
  server-header: ""

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edulife}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  mvc:
    # Surface unknown routes through the same @ExceptionHandler pipeline so missing endpoints
    # return the public 404 contract instead of being swallowed into Whitelabel or bubbled as 500.
    throw-exception-if-no-handler-found: true

  web:
    resources:
      # Static-resource fallback would otherwise catch /api/v1/... before NoHandlerFoundException
      # is raised, masking missing API endpoints. Disabled so unknown API paths reach the handler.
      add-mappings: false

  servlet:
    multipart:
      # Matches the avatar contract (5MB); request size adds a small overhead margin for the
      # multipart envelope itself.
      max-file-size: 5MB
      max-request-size: 6MB

firebase:
  admin:
    # Credentials must come from the environment so service account secrets never live in the repo.
    credentials-path: ${FIREBASE_ADMIN_CREDENTIALS_PATH:}
    credentials-json: ${FIREBASE_ADMIN_CREDENTIALS_JSON:}

edulife:
  avatar:
    storage-dir: ${EDULIFE_AVATAR_STORAGE_DIR:uploads/avatars}
    public-base-url: ${EDULIFE_AVATAR_PUBLIC_BASE_URL:http://localhost:8080/uploads/avatars}
    max-file-bytes: ${EDULIFE_AVATAR_MAX_FILE_BYTES:5242880}
  certificates:
    storage-dir: ${EDULIFE_CERTIFICATES_STORAGE_DIR:storage/certificates}
    public-base-url: ${EDULIFE_CERTIFICATES_PUBLIC_BASE_URL:http://localhost:8080/api/v1/certificates}
  advisor:
    provider: ${EDULIFE_ADVISOR_PROVIDER:stub}
    model: ${EDULIFE_ADVISOR_MODEL:none}
    groq-api-key: ${GROQ_API_KEY:}
    max-tokens: ${ADVISOR_MAX_TOKENS:600}
    rate-limit-per-hour: ${ADVISOR_RATE_LIMIT_PER_HOUR:10}
  staff:
    # Server-trusted staff role assignment by verified Firebase email. Re-asserted on every
    # /auth/sync so seeded staff land in their correct portal regardless of migration/deploy
    # ordering (the V18–V20 UPDATEs no-op when the row does not exist yet). Never driven by
    # client input. Rotate or clear these before a real production launch.
    roles:
      - email: admin@edulife.test
        role: ADMIN
      - email: teacher@edulife.test
        role: TEACHER
      - email: groupadmin@edulife.test
        role: GROUP_ADMIN

management:
  endpoints:
    web:
      exposure:
        # Expose only the health endpoint; env, beans, metrics, and all others stay closed.
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    # Comma-separated list of explicit origins.  Defaults to localhost dev origins so the
    # web app works without configuration during development.  Production MUST override with
    # the deployed website URL via APP_CORS_ALLOWED_ORIGINS (e.g. https://app.edulife.ma).
    # An empty value closes CORS entirely — no cross-origin browser request will be accepted.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
